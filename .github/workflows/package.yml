name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - name: Build isolated baseline installer
        run: npx electron-builder --config tests/installer-builder.cjs --win nsis --x64
        env:
          EPUB_INSTALLER_TEST_VERSION: '0.3.0'
      - name: Build isolated upgraded installer
        run: npx electron-builder --config tests/installer-builder.cjs --win nsis --x64
        env:
          EPUB_INSTALLER_TEST_VERSION: '0.3.1'
      - run: npm run test:installer
      - run: npm run dist
      - name: Verify packaged reader
        run: npm run test:desktop
        env:
          EPUB_TEST_EXECUTABLE: '${{ github.workspace }}\release\win-unpacked\Marginalia.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: Marginalia-Windows-x64
          path: release/Marginalia Setup*.exe
